<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Auto Sliding Door :: Mode Off  (door closed, neutral slate) -->
  <g fill="none" stroke="#475569" stroke-width="40" stroke-linejoin="round" stroke-linecap="round">
    <!-- Door frame -->
    <rect x="160" y="170" width="680" height="660" rx="12"/>
    <!-- Top track -->
    <line x1="180" y1="240" x2="820" y2="240"/>
    <!-- Bottom track -->
    <line x1="180" y1="760" x2="820" y2="760"/>
    <!-- Left panel (closed: meets at center) -->
    <rect x="210" y="240" width="290" height="520"/>
    <!-- Right panel (closed: meets at center) -->
    <rect x="500" y="240" width="290" height="520"/>
  </g>
  <!-- Handles near the meeting edge -->
  <g fill="#475569">
    <rect x="468" y="470" width="20" height="80" rx="10"/>
    <rect x="512" y="470" width="20" height="80" rx="10"/>
  </g>
</svg>
