<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <!-- Auto Sliding Door :: Mode Hold  (door slid open, amber) -->
  <g fill="none" stroke="#d97706" stroke-width="40" stroke-linejoin="round" stroke-linecap="round">
    <!-- Door frame -->
    <rect x="160" y="170" width="680" height="660" rx="12"/>
    <!-- Top track -->
    <line x1="180" y1="240" x2="820" y2="240"/>
    <!-- Bottom track -->
    <line x1="180" y1="760" x2="820" y2="760"/>
    <!-- Left panel slid LEFT (overhanging frame to show it has moved) -->
    <rect x="80"  y="240" width="290" height="520"/>
    <!-- Right panel slid RIGHT -->
    <rect x="630" y="240" width="290" height="520"/>
  </g>
  <!-- Central "pin / wedge" badge indicating the door is held open -->
  <g>
    <circle cx="500" cy="500" r="110" fill="#d97706"/>
    <!-- Pause-bar symbol (two thick vertical bars) reading as "held" -->
    <rect x="460" y="450" width="22" height="100" rx="6" fill="#ffffff"/>
    <rect x="518" y="450" width="22" height="100" rx="6" fill="#ffffff"/>
  </g>
</svg>
